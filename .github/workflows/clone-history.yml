name: Archive clone history
on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/clone_history.py'
      - '.github/workflows/clone-history.yml'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: archive-clone-history
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Read repository traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add the TRAFFIC_TOKEN repository secret with Administration (read) permission."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones?per=day" > "$RUNNER_TEMP/clones.json"
          gh api "repos/$GITHUB_REPOSITORY/traffic/views?per=day" > "$RUNNER_TEMP/views.json"
          gh api "repos/$GITHUB_REPOSITORY/traffic/popular/paths" > "$RUNNER_TEMP/paths.json"
      - name: Update archive and chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/.github/scripts/clone_history.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/archive.py"
          python3 "$RUNNER_TEMP/archive.py" "$RUNNER_TEMP/clones.json" "$RUNNER_TEMP/views.json" "$RUNNER_TEMP/paths.json"
